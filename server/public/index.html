<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Status</title>

  <style>
    /* === CORE STYLES (No Tailwind dependency) === */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      overflow: hidden;
      padding: 0 1rem;
      background-color: #050008;
      background-image: linear-gradient(rgba(0, 255, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.15) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
      box-sizing: border-box;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    @keyframes gridMove {
      from {
        background-position: 0 0;
      }
      to {
        background-position: 40px 40px;
      }
    }

    /* === SCANLINES === */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(to bottom,
          rgba(0, 255, 255, 0.04),
          rgba(0, 255, 255, 0.04) 1px,
          transparent 1px,
          transparent 3px);
      pointer-events: none;
      z-index: 50;
    }

    /* === NEON GLOW === */
    .neon {
      text-shadow: 0 0 5px #22d3ee, 0 0 10px #22d3ee, 0 0 20px #0ff;
    }

    .neon-box {
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4),
        inset 0 0 20px rgba(0, 255, 255, 0.15);
    }

    /* === FLICKER EFFECT === */
    .flicker {
      animation: flicker 2.5s infinite;
    }

    @keyframes flicker {
      0%, 100% {
        opacity: 1;
      }
      5% {
        opacity: 0.7;
      }
      10% {
        opacity: 1;
      }
      15% {
        opacity: 0.4;
      }
      20% {
        opacity: 1;
      }
    }

    /* === PARTICLES === */
    .particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: #00ffff;
      opacity: 0.8;
      animation: float 10s linear infinite;
    }

    @keyframes float {
      from {
        transform: translateY(100vh) translateX(0);
      }
      to {
        transform: translateY(-10vh) translateX(50px);
      }
    }

    /* === TERMINAL CARD === */
    .terminal-card {
      position: relative;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 0.75rem;
      padding: 2rem;
      z-index: 10;
      display: inline-block;
      text-align: center;
      border: 1px solid #22d3ee;
      width: 500px;
      max-width: 90vw;
    }

    .meta-top {
      position: absolute;
      top: 0.5rem;
      left: 0.75rem;
      color: #22d3ee;
      font-size: 0.75rem;
    }

    .meta-bottom {
      position: absolute;
      bottom: 0.5rem;
      right: 0.75rem;
      color: #22d3ee;
      font-size: 0.75rem;
    }

    @media (min-width: 640px) {
      .meta-top, .meta-bottom {
        font-size: 0.875rem;
      }
    }

    .card-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #22d3ee;
    }

    .card-title {
      font-size: 1.875rem;
      font-weight: 700;
      color: #67e8f9;
      margin-bottom: 1rem;
      margin-top: 0;
    }

    .card-text {
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      color: #22d3ee;
      white-space: pre-line;
    }

    @media (min-width: 640px) {
      .card-text {
        font-size: 1rem;
      }
    }

    .status-badge {
      background-color: rgba(8, 47, 73, 0.7);
      color: #67e8f9;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      border-radius: 0.375rem;
      border: 1px solid #06b6d4;
      letter-spacing: 0.1em;
    }

    @media (min-width: 640px) {
      .status-badge {
        padding: 0.5rem 1rem;
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <!-- PARTICLES -->
  <script>
    for (let i = 0; i < 150; i++) {
      const p = document.createElement("div");
      p.className = "particle";
      p.style.left = Math.random() * 100 + "vw";
      p.style.animationDuration = 5 + Math.random() * 10 + "s";
      p.style.opacity = Math.random();
      document.body.appendChild(p);
    }
  </script>

  <!-- TERMINAL CARD -->
  <div class="terminal-card neon-box">
    <div class="meta-top">
      SYS://STATUS
    </div>
    <div class="meta-bottom">
      BUILD_V1.0.0
    </div>

    <div class="card-icon neon">⌬</div>

    <!-- Typing animation -->
    <h1 id="typing-title" class="card-title neon"></h1>
    <p id="typing-text" class="card-text"></p>

    <!-- Flickering status -->
    <div class="status-badge neon flicker">
      STATUS: RUNNING
    </div>
  </div>

  <!-- TYPING ANIMATION -->
  <script>
    const titleText = "SERVER ONLINE";
    const bodyText = "Node.js instance synchronized\n[ Render Cyber Cloud ]";

    const titleEl = document.getElementById("typing-title");
    const bodyEl = document.getElementById("typing-text");

    let i = 0,
      j = 0;

    function typeTitle() {
      if (i < titleText.length) {
        titleEl.textContent += titleText.charAt(i++);
        setTimeout(typeTitle, 80);
      } else {
        setTimeout(typeBody, 400);
      }
    }

    function typeBody() {
      if (j < bodyText.length) {
        bodyEl.textContent += bodyText.charAt(j++);
        setTimeout(typeBody, 35);
      }
    }

    typeTitle();
  </script>
</body>

</html>
