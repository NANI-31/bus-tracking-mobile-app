# JVM heap: enough RAM for large projects. Tune down if you have < 16 GB RAM.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m \
  -XX:+UseParallelGC -Dfile.encoding=UTF-8

android.useAndroidX=true
# Jetifier is required for some older plugins. Check if you can disable it:
# run: ./gradlew checkJetifier  — if output is empty, set this to false for faster builds.
android.enableJetifier=true

# ── Build Speed ──────────────────────────────────────────────────────────────
# Use all available CPU cores for parallel task execution
org.gradle.workers.max=8

# Enable Gradle build cache (reuses outputs from previous builds)
org.gradle.caching=true

# Enable parallel project compilation
org.gradle.parallel=true

# Keep Gradle daemon alive between builds (avoids JVM startup cost)
org.gradle.daemon=true

# Disable configuration cache (causes Java module issues with some plugins)
org.gradle.configuration-cache=false

# Non-transitive R classes: each module only sees its own resources.
# Drastically reduces R class recompilation on resource-only changes.
android.nonTransitiveRClass=true

# Skip Jetifier check on every build for libraries that don't need it
android.jetifier.ignorelist=bcprov

# ── Legacy flags ─────────────────────────────────────────────────────────────
# These were added automatically by Flutter migrator
android.builtInKotlin=false
android.newDsl=false
